name: esportspulse
description: "A platform informasi untuk komunitas e-sports - Tugas Akhir TPM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2

  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1

  sensors_plus: ^6.1.1
  flutter_local_notifications: ^18.0.1

  http: ^1.3.0
  google_generative_ai: ^0.4.7
  intl: ^0.19.0
  timezone: ^0.9.4

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/